name: Flutter iOS CI/CD

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

env:
  FLUTTER_VERSION: '3.35.4'
  XCODE_VERSION: '26.2'

jobs:
  build-ios:
    timeout-minutes: 15
    name: Build Flutter iOS App
    runs-on: macos-15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          architecture: arm64
          cache: true

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Decode and create .env file
        run: |
          echo "${{ secrets.ENV_B64 }}" | base64 --decode > .env

      - name: Decode Secrets.xcconfig
        run: |
          mkdir -p ios/Flutter
          echo "${{ secrets.SECRETS_XCCONFIG_B64 }}" | base64 --decode > ios/Flutter/Secrets.xcconfig

      - name: Decode GoogleService-Info.plist
        run: |
          mkdir -p ios/Runner
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}" | base64 --decode > ./ios/Runner/GoogleService-Info.plist

      # firebase_options.dart 복원
      - name: Decode firebase_options.dart
        run: |
          mkdir -p lib
          echo "${{ secrets.FIREBASE_OPTIONS_B64 }}" | base64 --decode > lib/firebase_options.dart

      - name: Verify firebase_options.dart exists
        run: |
          test -f lib/firebase_options.dart && head -n 5 lib/firebase_options.dart || (echo "missing lib/firebase_options.dart" && exit 1)

      - name: Install Flutter dependencies
        run: flutter pub get

      # Hash the resolved Dart dependencies too, even when Podfile.lock is absent.
      - name: Cache iOS Pods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: iospods-v2-${{ runner.os }}-${{ runner.arch }}-flutter${{ env.FLUTTER_VERSION }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('pubspec.lock', 'ios/Podfile', 'ios/Podfile.lock') }}
          restore-keys: iospods-v2-${{ runner.os }}-${{ runner.arch }}-flutter${{ env.FLUTTER_VERSION }}-xcode${{ env.XCODE_VERSION }}-

      - name: Install iOS dependencies
        working-directory: ios
        run: pod install || pod install --repo-update

      - name: Upload resolved dependency locks
        uses: actions/upload-artifact@v4
        with:
          name: ios-dependency-locks
          path: |
            pubspec.lock
            ios/Podfile.lock
          if-no-files-found: error
          retention-days: 7

      # 코드 분석 수행 (경고는 허용, 에러만 실패 처리)
      - name: Analyze code
        run: flutter analyze --no-pub --no-fatal-warnings || echo "Analysis completed with warnings"
        continue-on-error: false

      # 무료 버전 - Apple Developer 계정 없이 빌드만
      - name: Build iOS (no codesign)
        run: |
          flutter build ios --release --no-pub --no-codesign
          echo "iOS build completed successfully!"

      # 빌드 결과 확인
      - name: List build artifacts
        run: |
          echo "Build artifacts:"
          ls -la build/ios/iphoneos/
          du -sh build/ios/iphoneos/Runner.app

      # iOS 빌드 결과물을 GitHub Artifacts에 업로드
      - name: Upload iOS App as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dongsoop-ios-app-${{ github.run_number }}
          path: build/ios/iphoneos/Runner.app
          retention-days: 7

      # 빌드 성공 알림
      - name: Build Success Summary
        run: |
          echo "🎉 Flutter iOS build completed successfully!"
          echo "📱 iOS app built without code signing"
          echo "📦 Artifacts uploaded to GitHub Actions"
          echo "⬇️ Download from: Actions tab > Artifacts"
          echo "🔗 Build #${{ github.run_number }}"
          echo "📁 Artifact name: dongsoop-ios-app-${{ github.run_number }}"
          echo "🍎 App name: Dongsoop (dongyang mirae university service)"
