name: Google Play Console Deploy - Android

on:
  push:
    branches: [ main ]

jobs:
  build-android:
    timeout-minutes: 30
    name: Google Play Console Deploy - Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle build cache
        uses: gradle/actions/setup-gradle@v4
        with:
          # This workflow only runs on main, even if the default branch differs.
          cache-read-only: false

      - name: Decode and create .env file
        run: |
          echo "${{ secrets.ENV_B64 }}" | base64 --decode > .env

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: 'stable'
          architecture: x64
          cache: true

      - name: Decode google-services.json
        run: |
          mkdir -p android/app
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > ./android/app/google-services.json

      - name: Decode firebase_options.dart
        run: |
          mkdir -p lib
          echo "${{ secrets.FIREBASE_OPTIONS_B64 }}" | base64 --decode > lib/firebase_options.dart

      - name: Create android/local.properties (CI)
        run: |
          mkdir -p android
          ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "KAKAO_NATIVE_APP_KEY=${{ secrets.KAKAO_NATIVE_APP_KEY }}" >> android/local.properties
          echo "local.properties created at android/local.properties"
          cat android/local.properties | sed 's/KAKAO_NATIVE_APP_KEY=.*/KAKAO_NATIVE_APP_KEY=***REDACTED***/'  

      - name: Verify firebase_options.dart exists
        run: |
          test -f lib/firebase_options.dart && head -n 5 lib/firebase_options.dart || (echo "missing lib/firebase_options.dart" && exit 1)

      - name: Decode and install signing key
        run: |
          mkdir -p android/app/keystore
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 --decode > android/app/keystore/my-release-key.jks
          echo "storeFile=keystore/my-release-key.jks" > android/app/keystore/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/app/keystore/key.properties
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> android/app/keystore/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/app/keystore/key.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-pub --no-fatal-warnings || echo "Analysis completed with warnings"
        continue-on-error: false

      - name: Auto-increment build number
        run: |
          BUILD_NO=$(date +%s)
          echo "BUILD_NO=$BUILD_NO" >> $GITHUB_ENV

      - name: Build Flutter Android App Bundle
        run: flutter build appbundle --release --no-pub --build-number=$BUILD_NO

      - name: Upload app to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.dongsoop.site.dongsoop
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - name: Extract build date (KST)
        run: |
          TZ=Asia/Seoul date +"%Y-%m-%d %H:%M" > .build_date
          echo "BUILD_DATE=$(cat .build_date)" >> $GITHUB_ENV

      - name: Extract app version
        run: |
          APP_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV

      - name: Build Success Summary
        run: |
          echo "🎉 Flutter Android app bundle built and uploaded successfully!"
          echo "📦 App Bundle uploaded to Google Play Internal track"
          echo "🔗 Build #${{ github.run_number }}"
          echo "🗓️ Date (KST): $BUILD_DATE"

      - name: Send Discord Notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.APPLE_BUILD_DISCORD_WEBHOOK }}
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d "{\"content\": \"🚀 Android 빌드가 성공적으로 완료되었습니다! 🗓️ 날짜(KST): $BUILD_DATE${APP_VERSION:+\\n🏷️ 버전: $APP_VERSION}\"}" \
            $DISCORD_WEBHOOK
