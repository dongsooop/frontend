<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>동숲 캠퍼스 지도 목업</title>
  <meta name="description" content="건물별 층 시설 정보를 확인하는 캠퍼스 지도 목업">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23006DFF'/%3E%3Cpath d='M14 25 32 14l18 11v24H14z' fill='white'/%3E%3Cpath d='M24 49V34h16v15' fill='%23006DFF'/%3E%3C/svg%3E">
  <style>
    @font-face { font-family: Pretendard; src: url('../assets/fonts/Pretendard-Regular.ttf'); font-weight: 400; }
    @font-face { font-family: Pretendard; src: url('../assets/fonts/Pretendard-SemiBold.ttf'); font-weight: 600 800; }

    :root {
      --blue: #006dff;
      --blue-soft: #ebf3ff;
      --ink: #252525;
      --muted: #767676;
      --line: #e7e9ed;
      --map: #f5f7fa;
      --white: #fff;
    }

    * { box-sizing: border-box; }
    html { background: #eef1f5; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button { font: inherit; }

    .phone {
      width: min(100%, 430px);
      min-height: 100dvh;
      margin: 0 auto;
      background: var(--white);
      box-shadow: 0 0 40px rgb(25 37 56 / 10%);
      overflow: hidden;
    }

    .topbar {
      height: 60px;
      padding: 8px 12px;
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      background: rgb(255 255 255 / 94%);
    }

    .topbar h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.4;
      text-align: center;
      font-weight: 700;
    }

    .icon-button {
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--ink);
      background: transparent;
      cursor: pointer;
    }

    .icon-button:active { background: #f2f2f2; }

    .intro {
      padding: 8px 20px 18px;
    }

    .intro strong {
      display: block;
      font-size: 17px;
      line-height: 1.5;
      font-weight: 700;
    }

    .intro span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    /* 지도는 페이지의 20px 콘텐츠 패딩 밖에 둔다. 화면 너비를 그대로 쓰고,
       높이는 항상 너비 이상이어서 모바일에서 지도가 납작해지지 않는다. */
    .map-stage {
      position: relative;
      width: 100%;
      min-height: 100vw;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: var(--map);
      touch-action: none;
      cursor: grab;
    }

    .map-stage:active { cursor: grabbing; }

    @media (min-width: 430px) {
      .map-stage { min-height: 430px; }
    }

    .map-board {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      aspect-ratio: 2048 / 928;
      transform-origin: 0 0;
      will-change: transform;
    }

    .map-vector {
      width: 100%;
      height: 100%;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    .map-hint {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      min-width: max-content;
      padding: 8px 12px;
      border: 1px solid rgb(255 255 255 / 70%);
      border-radius: 999px;
      color: #545961;
      background: rgb(255 255 255 / 88%);
      box-shadow: 0 4px 14px rgb(41 55 74 / 10%);
      backdrop-filter: blur(8px);
      font-size: 13px;
      font-weight: 600;
      pointer-events: none;
    }

    .detail {
      padding: 24px 20px 40px;
      background: var(--white);
    }

    .detail-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--blue);
      font-size: 14px;
      line-height: 1.4;
      font-weight: 700;
    }

    .detail h2 {
      margin: 0;
      font-size: 24px;
      line-height: 1.35;
      letter-spacing: -0.02em;
    }

    .count {
      flex: 0 0 auto;
      margin-top: 4px;
      padding: 6px 10px;
      border-radius: 8px;
      color: #545961;
      background: #f3f5f8;
      font-size: 13px;
      font-weight: 600;
    }

    .floors { margin-top: 4px; }
    .floor {
      display: grid;
      grid-template-columns: 48px 1fr;
      gap: 12px;
      padding: 18px 0;
      border-bottom: 1px solid var(--line);
    }

    .floor:last-child { border-bottom: 0; }
    .floor-name {
      color: var(--blue);
      font-size: 16px;
      line-height: 1.55;
      font-weight: 700;
    }

    .facilities {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .facility {
      padding: 7px 10px;
      border: 1px solid #dfe6f1;
      border-radius: 8px;
      color: #454951;
      background: #fafcff;
      font-size: 14px;
      line-height: 1.35;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>

        ['1F', '대강당', 'CU', '써브웨이', 'KB금융은행 및 ATM', '여행사(GHRC)', '유료(택배)사물함'],
        ['B1F', '주차장']
      ] }
    };

    const groups = [...document.querySelectorAll('[data-building]')];
    const floors = document.querySelector('#floors');
    const name = document.querySelector('#building-name');
    const count = document.querySelector('#floor-count');
    const selectedTitle = document.querySelector('#selected-title');

    function selectBuilding(id) {
      const building = buildings[id];

      groups.forEach(group => {
        const active = group.dataset.building === id;
        group.classList.toggle('selected', active);
        group.setAttribute('aria-pressed', String(active));
      });

      selectedTitle.textContent = building.name;
      name.textContent = building.name;
      count.textContent = `${building.floors.length}개 층`;
      floors.innerHTML = building.floors.map(([floor, ...items]) => `
        <div class="floor">
          <div class="floor-name">${floor}</div>
          <div class="facilities">${items.map(item => `<span class="facility">${item}</span>`).join('')}</div>
        </div>
      `).join('');
    }

    groups.forEach(group => {
      group.addEventListener('click', () => selectBuilding(group.dataset.building));
      group.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          selectBuilding(group.dataset.building);
        }
      });
    });

    selectBuilding('1');

    /* 지도 팬 · 줌: 축마다 지도가 무대를 벗어나지 않도록 이동량을 가둔다.
       지도가 무대보다 작은 축은 항상 가운데 정렬된다. */
    const stage = document.querySelector('.map-stage');
    const board = document.querySelector('.map-board');
    const MIN_SCALE = 1;
    const MAX_SCALE = 4;
    let scale = 1.9;
    let tx = -1e6;
    let ty = 0;

    function clampAxis(offset, content, view) {
      return content >= view
        ? Math.min(0, Math.max(view - content, offset))
        : (view - content) / 2;
    }

    function apply() {
      tx = clampAxis(tx, board.offsetWidth * scale, stage.clientWidth);
      ty = clampAxis(ty, board.offsetHeight * scale, stage.clientHeight);
      board.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
    }

    function zoomTo(px, py, next) {
      next = Math.min(MAX_SCALE, Math.max(MIN_SCALE, next));
      const ratio = next / scale;
      tx = px - (px - tx) * ratio;
      ty = py - (py - ty) * ratio;
      scale = next;
      apply();
    }

    const pointers = new Map();
    let gesture = null;
    let dragged = false;

    function gestureState() {
      const points = [...pointers.values()];
      const rect = stage.getBoundingClientRect();
      const second = points[1] ?? points[0];
      return {
        x: (points[0].x + second.x) / 2 - rect.left,
        y: (points[0].y + second.y) / 2 - rect.top,
        spread: points.length > 1 ? Math.hypot(points[0].x - second.x, points[0].y - second.y) : 0
      };
    }

    stage.addEventListener('pointerdown', event => {
      stage.setPointerCapture(event.pointerId);
      pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
      gesture = gestureState();
      dragged = false;
    });

    stage.addEventListener('pointermove', event => {
      if (!pointers.has(event.pointerId)) return;
      pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
      const next = gestureState();
      if (gesture) {
        if (Math.abs(next.x - gesture.x) + Math.abs(next.y - gesture.y) > 4) dragged = true;
        tx += next.x - gesture.x;
        ty += next.y - gesture.y;
        if (next.spread && gesture.spread) {
          dragged = true;
          zoomTo(next.x, next.y, scale * (next.spread / gesture.spread));
        } else {
          apply();
        }
      }
      gesture = next;
    });

    function endPointer(event) {
      pointers.delete(event.pointerId);
      gesture = pointers.size ? gestureState() : null;
    }

    stage.addEventListener('pointerup', endPointer);
    stage.addEventListener('pointercancel', endPointer);

    stage.addEventListener('wheel', event => {
      event.preventDefault();
      const rect = stage.getBoundingClientRect();
      zoomTo(event.clientX - rect.left, event.clientY - rect.top, scale * Math.exp(-event.deltaY * 0.0015));
    }, { passive: false });

    // 지도를 끌고 난 뒤 손을 뗄 때 건물이 선택되는 것을 막는다.
    stage.addEventListener('click', event => {
      if (dragged) {
        event.stopPropagation();
        event.preventDefault();
      }
    }, true);

    window.addEventListener('resize', apply);
    requestAnimationFrame(apply);
  </script>
</body>
</html>
